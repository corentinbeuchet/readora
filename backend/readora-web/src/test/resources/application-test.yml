spring:
  application:
    name: readora-test
  datasource:
    url: jdbc:h2:mem:readoratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Schema comes from the Flyway migrations; Hibernate only checks the entities match it.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  s3:
    bucket-name: test-media-bucket
    region: us-east-1
  cloudfront:
    domain: https://cdn-test.readora.com

readora:
  frontend:
    base-url: http://localhost:4200
  cors:
    allowed-origins: http://localhost:4200
  jobs:
    enabled: false
  comments:
    # Tests post several comments in a row; CommentRateLimitIntegrationTest turns the limit back on.
    min-interval: 0s
  security:
    cookie-secure: false
    rate-limit:
      enabled: false
    jwt:
      secret: test-only-readora-jwt-secret-0123456789abcdef0123456789
      access-ttl: PT15M
      refresh-ttl: P30D
      # Reuse of a rotated refresh token is treated as theft immediately in tests.
      refresh-reuse-grace: PT0S
  stripe:
    secret-key: sk_test_dummy
    webhook-secret: whsec_test_dummy
    premium-price-id: price_test_premium
