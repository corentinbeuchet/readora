spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://readora-prod-db.cxxxx.eu-west-1.rds.amazonaws.com:5432/readoradb}
    username: ${SPRING_DATASOURCE_USERNAME:readora_prod}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  s3:
    enabled: ${AWS_S3_ENABLED:true}
    bucket-name: ${AWS_S3_BUCKET_NAME:readora-media-prod}
    region: ${AWS_REGION:eu-west-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:false}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:https://cdn.readora.com}

readora:
  cors:
    allowed-origins: ${READORA_CORS_ALLOWED_ORIGINS:https://readora.com}
  security:
    cookie-secure: true
    jwt:
      secret: ${READORA_JWT_SECRET}

server:
  forward-headers-strategy: native
  port: ${PORT:8080}

# API docs are for development and staging only.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
