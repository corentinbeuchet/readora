spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://readora-staging-db.cxxxx.eu-west-1.rds.amazonaws.com:5432/readoradb}
    username: ${SPRING_DATASOURCE_USERNAME:readora_staging}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:readora-media-staging}
    region: ${AWS_REGION:eu-west-1}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:https://staging-cdn.readora.com}

readora:
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://staging.readora.com}
  cors:
    allowed-origins: ${READORA_CORS_ALLOWED_ORIGINS:https://staging.readora.com}
  security:
    cookie-secure: ${READORA_COOKIE_SECURE:true}
    jwt:
      secret: ${READORA_JWT_SECRET}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}

server:
  port: ${PORT:8080}
