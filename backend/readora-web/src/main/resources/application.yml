spring:
  servlet:
    multipart:
      max-file-size: ${READORA_MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${READORA_MAX_UPLOAD_REQUEST_SIZE:55MB}
  application:
    name: readora-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/readoradb}
    username: ${SPRING_DATASOURCE_USERNAME:readora_user}
    password: ${SPRING_DATASOURCE_PASSWORD:readora_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  s3:
    # false = local-disk storage (dev without MinIO); staging/production enable S3.
    enabled: ${AWS_S3_ENABLED:false}
    bucket-name: ${AWS_S3_BUCKET_NAME:readora-media-dev}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_S3_ENDPOINT:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:false}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:/api/v1/storage/assets}

readora:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${READORA_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    refresh-cookie-name: readora_refresh
    cookie-secure: ${READORA_COOKIE_SECURE:false}
    jwt:
      # Must be at least 32 bytes. Always override in non-dev environments.
      secret: ${READORA_JWT_SECRET:dev-only-readora-jwt-secret-please-change-me-0123456789}
      issuer: readora
      access-ttl: ${READORA_JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${READORA_JWT_REFRESH_TTL:P30D}
  stripe:
    # Test-mode keys from the Stripe dashboard; webhook secret from `stripe listen` locally.
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
