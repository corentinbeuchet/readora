spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://readora-prod-db.cxxxx.eu-west-1.rds.amazonaws.com:5432/readoradb}
    username: ${SPRING_DATASOURCE_USERNAME:readora_prod}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:readora-media-prod}
    region: ${AWS_REGION:eu-west-1}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:https://cdn.readora.com}

readora:
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://readora.com}
  cors:
    allowed-origins: ${READORA_CORS_ALLOWED_ORIGINS:https://readora.com}
  security:
    cookie-secure: true
    jwt:
      secret: ${READORA_JWT_SECRET}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    premium-price-id: ${STRIPE_PREMIUM_PRICE_ID}

server:
  port: ${PORT:8080}
