<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Readora — read manga, manhwa & comics</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Read manga, manhwa, manhua and comics published by scanlation teams. Free reading, comments, and Premium bookmarks.">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <!-- Applies a saved light/dark choice before the first paint (ThemeStore, key readora.theme, keeps it in sync). -->
  <script>
    try {
      var theme = JSON.parse(localStorage.getItem('readora.theme'));
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="Readora">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Readora — read manga, manhwa & comics">
  <meta property="og:description" content="Read manga, manhwa, manhua and comics published by scanlation teams. Free reading, comments, and Premium bookmarks.">
  <meta property="og:image" content="/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The one font file every page needs (same URL as src/styles/_fonts.scss, so it is fetched once). -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-latin-wdth-normal.woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
</head>
<body>
  <app-root></app-root>
</body>
</html>
