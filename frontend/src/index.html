<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Readora — read manga, manhwa & comics</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Read manga, manhwa, manhua and comics published by scanlation teams. Free reading, comments, and Premium bookmarks.">
  <meta name="theme-color" content="#0e0e10">
  <meta name="color-scheme" content="dark light">
  <!--
    Readora is dark unless the reader chose Light or System (ThemeStore, key readora.theme, keeps it in sync). Applied
    before the first paint; the colours are --bg of each theme (src/styles/_tokens.scss).
  -->
  <script>
    try {
      var theme = JSON.parse(localStorage.getItem('readora.theme'));
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      if (theme === 'system') document.documentElement.removeAttribute('data-theme');
      if (theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f7f5');
      }
      // A returning reader (AuthStore's hint, not a secret): the home page keeps room for "Continue reading".
      if (JSON.parse(localStorage.getItem('readora.has-session')) === true) document.documentElement.setAttribute('data-has-session', '');
    } catch (e) {}
  </script>
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="Readora">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Readora — read manga, manhwa & comics">
  <meta property="og:description" content="Read manga, manhwa, manhua and comics published by scanlation teams. Free reading, comments, and Premium bookmarks.">
  <meta property="og:image" content="/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The one font file every page needs (same URL as src/styles/_fonts.scss, so it is fetched once). -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-latin-wdth-normal.woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
</head>
<body>
  <app-root></app-root>
</body>
</html>
