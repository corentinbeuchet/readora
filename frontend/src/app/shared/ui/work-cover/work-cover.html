@if (shown(); as url) {
  <img [ngSrc]="url" [alt]="alt()" [width]="width()" [height]="height()" [priority]="priority()" (error)="handleError($event)" />
} @else {
  <!-- eslint-disable-next-line @angular-eslint/template/prefer-ngsrc -- data: URL fallback, which NgOptimizedImage rejects -->
  <img [src]="fallback" [alt]="alt()" [width]="width()" [height]="height()" />
}
