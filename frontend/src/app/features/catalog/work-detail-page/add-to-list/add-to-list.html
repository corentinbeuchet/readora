<div class="add-to-list">
  <button type="button" class="btn btn-ghost" aria-controls="add-to-list-panel" [attr.aria-expanded]="open()" (click)="toggle()" i18n="@@catalog.addToList.open">Add to a list</button>
  <div id="add-to-list-panel" class="add-to-list-panel" [hidden]="!open()">
    @if (mine.error()) {
      <app-load-error (retry)="mine.reload()" i18n="@@catalog.addToList.loadError">Your lists could not be loaded.</app-load-error>
    } @else if (mine.hasValue()) {
      @if (mine.value().length === 0) {
        <p class="muted" i18n="@@catalog.addToList.noList">Make <a routerLink="/lists">a list</a> to collect series you recommend.</p>
      } @else {
        <form class="add-to-list-form" (submit)="add($event)">
          <label class="field">
            <span i18n="@@catalog.addToList.list">List</span>
            <select (change)="selected.set(value($event))">
              @for (list of mine.value(); track list.id) {
                <option [value]="list.id">{{ list.title }}</option>
              }
            </select>
          </label>
          <label class="field">
            <span i18n="@@catalog.addToList.note">Note (optional)</span>
            <input type="text" maxlength="300" [value]="note()" (input)="note.set(value($event))" />
          </label>
          <button type="submit" class="btn" [disabled]="adding.busy()" i18n="@@catalog.addToList.submit">Add</button>
          <p class="muted" role="status">{{ message() }}</p>
          @if (adding.error(); as message) {
            <p class="form-error" role="alert">{{ message }}</p>
          }
        </form>
      }
    } @else if (open()) {
      <p class="muted" role="status" i18n="@@catalog.addToList.loading">Loading your lists…</p>
    }
  </div>
</div>
