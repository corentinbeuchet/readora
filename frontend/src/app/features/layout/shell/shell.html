<div class="app-layout" [class.immersive]="layout.immersive()">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="app-header">
    <a routerLink="/" class="logo" aria-label="Readora home">
      <span class="logo-text">Readora</span>
    </a>

    <!-- Below the lg breakpoint the navigation is a disclosure (CSS decides visibility, so prerendered HTML is right). -->
    <button #navToggle type="button" class="btn nav-toggle" aria-controls="primary-nav" [attr.aria-expanded]="navOpen()" (click)="toggleNav()">
      <span aria-hidden="true">☰</span> Menu
    </button>

    <!-- Site navigation is a list of links (not an ARIA menubar): native Tab/Enter, one navigation per activation. -->
    <nav id="primary-nav" class="app-nav" [class.nav-open]="navOpen()" aria-label="Primary">
      <ul class="nav-list">
        <li>
          <a class="nav-link" routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        </li>
        <li>
          <a class="nav-link" routerLink="/works" routerLinkActive="active" ariaCurrentWhenActive="page">Catalog</a>
        </li>
        <li>
          <a class="nav-link" routerLink="/updates" routerLinkActive="active" ariaCurrentWhenActive="page">Updates</a>
        </li>
        <li>
          <a class="nav-link" routerLink="/rankings" routerLinkActive="active" ariaCurrentWhenActive="page">Rankings</a>
        </li>
        <li>
          <a class="nav-link" routerLink="/lists" routerLinkActive="active" ariaCurrentWhenActive="page">Lists</a>
        </li>
        <li *appHasPermission="'PROJECT_VIEW'">
          <a class="nav-link" routerLink="/scanlation" routerLinkActive="active" ariaCurrentWhenActive="page">Scanlation</a>
        </li>
        <li *appHasPermission="'WORK_CREATE'">
          <a class="nav-link" routerLink="/upload" routerLinkActive="active" ariaCurrentWhenActive="page">Upload Studio</a>
        </li>
      </ul>
    </nav>

    <app-omnisearch />

    <div class="user-area">
      @if (auth.restoring()) {
        <span class="muted">…</span>
      } @else if (auth.isAuthenticated()) {
        <app-notification-bell *appHasPermission="'LIBRARY_USE'" />
        <button
          type="button"
          class="btn user-trigger"
          ngMenuTrigger
          [menu]="userMenu"
          aria-label="Account menu"
        >
          @if (auth.user()?.avatarUrl; as avatar) {
            <img class="avatar" [ngSrc]="avatar" alt="" width="24" height="24" />
          }
          <span class="user-name">{{ auth.user()?.displayName }}</span>
          @if (auth.isPremium()) {
            <span class="badge badge-premium">Premium</span>
          }
        </button>
        <div ngMenu #userMenu="ngMenu" (itemSelected)="onUserMenuSelected($event)" class="user-menu">
          <ng-template ngMenuContent>
            <button type="button" ngMenuItem value="/library">My library</button>
            <button type="button" ngMenuItem value="/history">History</button>
            <button *appHasPermission="'COMMENT_MODERATE'" type="button" ngMenuItem value="/moderation">Moderation</button>
            <button type="button" ngMenuItem value="/profile">Profile</button>
            <button type="button" ngMenuItem value="/subscription">Subscription</button>
            <button type="button" ngMenuItem value="logout">Log out</button>
          </ng-template>
        </div>
      } @else {
        <a routerLink="/login" class="btn">Log in</a>
        <a routerLink="/register" class="btn btn-primary">Sign up</a>
      }
    </div>
  </header>

  <main id="main-content" class="app-main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p class="muted">© {{ year }} Readora — read manga, manhwa and comics.</p>
  </footer>
</div>
