<div class="app-layout" [class.immersive]="layout.immersive()" [class.no-tabbar]="layout.tabBarHidden() || layout.immersive()">
  <a class="skip-link" href="#main-content" i18n="@@shell.skipLink">Skip to main content</a>

  <header class="app-header">
    <!-- The logo is the way home: there is no "Home" link next to it on a computer (US-14). -->
    <a routerLink="/" class="logo" aria-label="Readora home" i18n-aria-label="@@shell.homeLink">
      <span class="logo-text">Readora</span>
    </a>

    <!-- One navigation for every screen: a tab bar at the bottom below lg, links here from lg (CSS only). -->
    <app-primary-nav [class.tabbar-hidden]="layout.tabBarHidden() || layout.immersive()" />

    <app-omnisearch />

    <div class="user-area">
      @if (theme.preference() === 'light') {
        <button type="button" class="btn btn-ghost btn-icon" (click)="theme.setPreference('dark')" aria-label="Switch to the dark theme" i18n-aria-label="@@shell.theme.toDark">
          <app-icon name="moon" />
        </button>
      } @else {
        <button type="button" class="btn btn-ghost btn-icon" (click)="theme.setPreference('light')" aria-label="Switch to the light theme" i18n-aria-label="@@shell.theme.toLight">
          <app-icon name="sun" />
        </button>
      }
      @if (auth.restoring()) {
        <span class="muted">…</span>
      } @else if (auth.isAuthenticated()) {
        <app-notification-bell *appHasPermission="'LIBRARY_USE'" />
        <button
          type="button"
          class="btn user-trigger"
          ngMenuTrigger
          [menu]="userMenu"
          aria-label="Account menu"
          i18n-aria-label="@@shell.accountMenu"
        >
          @if (auth.user()?.avatarUrl; as avatar) {
            <img class="avatar" [ngSrc]="avatar" alt="" width="24" height="24" />
          } @else {
            <app-icon name="user" />
          }
          <span class="user-name">{{ auth.user()?.displayName }}</span>
        </button>
        <div ngMenu #userMenu="ngMenu" (itemSelected)="onUserMenuSelected($event)" class="user-menu">
          <ng-template ngMenuContent>
            <button type="button" ngMenuItem value="/profile" i18n="@@shell.menu.profile">Profile</button>
            <button type="button" ngMenuItem value="/history" i18n="@@shell.menu.history">History</button>
            @if (hasTeamTools()) {
              <div role="separator" class="menu-separator"></div>
              <div role="group" class="menu-group" aria-label="Team tools" i18n-aria-label="@@shell.menu.team">
                <button type="button" ngMenuItem value="/scanlation" i18n="@@shell.menu.scanlation">Studio</button>
                <button *appHasPermission="'COMMENT_MODERATE'" type="button" ngMenuItem value="/moderation" i18n="@@shell.menu.moderation">Moderation</button>
              </div>
              <div role="separator" class="menu-separator"></div>
            }
            <button type="button" ngMenuItem value="logout" i18n="@@shell.menu.logout">Log out</button>
          </ng-template>
        </div>
      } @else {
        <a routerLink="/login" class="btn" i18n="@@shell.login">Log in</a>
        <a routerLink="/register" class="btn btn-primary" i18n="@@shell.signUp">Sign up</a>
      }
    </div>
  </header>

  <main id="main-content" class="app-main" tabindex="-1">
    <router-outlet />
  </main>

  <app-site-footer class="app-footer" [url]="url()" />
</div>
