<form class="form" (submit)="onSubmit($event)" novalidate>
  <p class="muted" i18n="@@profile.password.intro">Changing it signs you out on your other devices.</p>
  @if (changing.error(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <div class="field">
    <label for="pw-current" i18n="@@profile.password.current">Current password</label>
    <input id="pw-current" type="password" autocomplete="current-password" [formField]="passwordForm.currentPassword"
           [appAriaInvalid]="passwordForm.currentPassword" aria-describedby="pw-current-error" />
    <app-field-errors id="pw-current-error" [field]="passwordForm.currentPassword" />
  </div>

  <div class="field">
    <label for="pw-new" i18n="@@profile.password.new">New password</label>
    <input id="pw-new" type="password" autocomplete="new-password" [formField]="passwordForm.newPassword"
           [appAriaInvalid]="passwordForm.newPassword" aria-describedby="pw-new-error" />
    <app-field-errors id="pw-new-error" [field]="passwordForm.newPassword" />
  </div>

  <div class="field">
    <label for="pw-confirm" i18n="@@profile.password.confirm">Confirm the new password</label>
    <input id="pw-confirm" type="password" autocomplete="new-password" [formField]="passwordForm.confirmPassword"
           [appAriaInvalid]="passwordForm.confirmPassword" aria-describedby="pw-confirm-error" />
    <app-field-errors id="pw-confirm-error" [field]="passwordForm.confirmPassword" />
  </div>

  <p class="muted" role="status">{{ done() }}</p>

  <button type="submit" class="btn" [disabled]="changing.busy()">
    @if (changing.busy()) {
      <ng-container i18n="@@profile.password.submitting">Changing…</ng-container>
    } @else {
      <ng-container i18n="@@profile.password.submit">Change password</ng-container>
    }
  </button>
</form>
