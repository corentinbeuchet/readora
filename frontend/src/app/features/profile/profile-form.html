<form class="form" (submit)="onSubmit($event)" novalidate>
  @if (errorMessage(); as error) {
    <p class="form-error" role="alert">{{ error }}</p>
  }
  @if (status() === 'saved') {
    <p class="form-success" role="status">Profile saved.</p>
  }

  <div class="field">
    <label for="profile-display-name">Display name</label>
    <input id="profile-display-name" type="text" autocomplete="nickname" [formField]="profileForm.displayName"
           [appAriaInvalid]="profileForm.displayName" aria-describedby="profile-display-name-error" />
    <app-field-errors id="profile-display-name-error" [field]="profileForm.displayName" />
  </div>

  <div class="field">
    <label for="profile-bio">Bio</label>
    <textarea id="profile-bio" [formField]="profileForm.bio"
              [appAriaInvalid]="profileForm.bio" aria-describedby="profile-bio-error"></textarea>
    <app-field-errors id="profile-bio-error" [field]="profileForm.bio" />
  </div>

  <div class="field">
    <label for="profile-avatar">Avatar URL</label>
    <input id="profile-avatar" type="url" autocomplete="photo" [formField]="profileForm.avatarUrl"
           [appAriaInvalid]="profileForm.avatarUrl" aria-describedby="profile-avatar-error" />
    <app-field-errors id="profile-avatar-error" [field]="profileForm.avatarUrl" />
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="status() === 'saving'">
    {{ status() === 'saving' ? 'Saving…' : 'Save changes' }}
  </button>
</form>
