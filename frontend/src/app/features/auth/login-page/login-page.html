<section class="page-narrow">
  <h1 i18n="@@auth.login.title">Log in</h1>
  <p class="muted" i18n="@@auth.login.welcome">Welcome back to Readora.</p>

  <form class="form card" (submit)="onSubmit($event)" novalidate [attr.aria-describedby]="signingIn.error() ? 'login-error' : null">
    <!-- Always rendered (only the text changes), so screen readers announce the error when it appears. -->
    <p id="login-error" class="form-error" role="alert">{{ signingIn.error() }}</p>

    <div class="field">
      <label for="login-email" i18n="@@auth.login.email">Email</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        [formField]="loginForm.email"
        [appAriaInvalid]="loginForm.email"
        aria-describedby="login-email-error"
      />
      <app-field-errors id="login-email-error" [field]="loginForm.email" />
    </div>

    <div class="field">
      <label for="login-password" i18n="@@auth.login.password">Password</label>
      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        [formField]="loginForm.password"
        [appAriaInvalid]="loginForm.password"
        aria-describedby="login-password-error"
      />
      <app-field-errors id="login-password-error" [field]="loginForm.password" />
      <a routerLink="/forgot-password" i18n="@@auth.login.forgot">Forgot your password?</a>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="signingIn.busy()">
      @if (signingIn.busy()) {
        <ng-container i18n="@@auth.login.submitting">Logging in…</ng-container>
      } @else {
        <ng-container i18n="@@auth.login.submit">Log in</ng-container>
      }
    </button>

    <p class="muted" i18n="@@auth.login.noAccount">No account yet? <a routerLink="/register">Create one</a></p>
  </form>
</section>
