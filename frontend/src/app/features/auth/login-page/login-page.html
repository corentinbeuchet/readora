<section class="page-narrow">
  <h1>Log in</h1>
  <p class="muted">Welcome back to Readora.</p>

  <form class="form card" (submit)="onSubmit($event)" novalidate [attr.aria-describedby]="signingIn.error() ? 'login-error' : null">
    <!-- Always rendered (only the text changes), so screen readers announce the error when it appears. -->
    <p id="login-error" class="form-error" role="alert">{{ signingIn.error() }}</p>

    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        [formField]="loginForm.email"
        [appAriaInvalid]="loginForm.email"
        aria-describedby="login-email-error"
      />
      <app-field-errors id="login-email-error" [field]="loginForm.email" />
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        autocomplete="current-password"
        [formField]="loginForm.password"
        [appAriaInvalid]="loginForm.password"
        aria-describedby="login-password-error"
      />
      <app-field-errors id="login-password-error" [field]="loginForm.password" />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="signingIn.busy()">
      {{ signingIn.busy() ? 'Logging in…' : 'Log in' }}
    </button>

    <p class="muted">No account yet? <a routerLink="/register">Create one</a></p>
  </form>
</section>
