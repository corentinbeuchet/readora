<section class="prompt" aria-labelledby="signup-prompt-heading">
  <div class="prompt-text">
    <h2 id="signup-prompt-heading" i18n="@@home.signup.heading">Pick up where you stopped</h2>
    <p i18n="@@home.signup.text">A free account remembers the chapter you were reading, keeps the series you follow in one library and tells you when a new chapter is out. Reading stays free without one.</p>
  </div>
  <p class="prompt-actions">
    <a routerLink="/register" class="btn btn-primary" i18n="@@home.signup.create">Create a free account</a>
    <a routerLink="/login" class="btn" i18n="@@home.signup.login">Log in</a>
  </p>
</section>
