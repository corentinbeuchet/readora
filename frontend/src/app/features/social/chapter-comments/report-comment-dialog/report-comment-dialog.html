<app-dialog labelledBy="report-comment-title" (closed)="closed.emit()">
  <form class="form" (submit)="send($event)" novalidate>
    <h2 id="report-comment-title" i18n="@@social.reportComment.title">Report {{ comment().authorUsername }}'s comment</h2>
    <fieldset class="report-reasons">
      <legend i18n="@@social.reportComment.question">What is wrong with it?</legend>
      @for (option of reasons; track option) {
        <label class="checkbox">
          <input type="radio" name="comment-report-reason" [value]="option" [checked]="reason() === option" (change)="reason.set(option)" />
          {{ labels[option] }}
        </label>
      }
    </fieldset>
    @if (sending.error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
    <div class="dialog-actions">
      <button type="button" class="btn" (click)="closed.emit()" i18n="@@social.reportComment.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="sending.busy()">
        @if (sending.busy()) {
          <ng-container i18n="@@social.reportComment.sending">Sending…</ng-container>
        } @else {
          <ng-container i18n="@@social.reportComment.send">Send report</ng-container>
        }
      </button>
    </div>
  </form>
</app-dialog>
