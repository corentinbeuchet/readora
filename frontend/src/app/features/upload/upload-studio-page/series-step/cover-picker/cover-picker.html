<div class="cover-uploader-section" role="group" aria-labelledby="cover-image-label">
  <span id="cover-image-label" class="group-label" i18n="@@upload.cover.label">Cover Image</span>
  @if (previewUrl()) {
    <div class="cover-preview-card">
      <!-- eslint-disable-next-line @angular-eslint/template/prefer-ngsrc -- blob: preview of a local file, nothing to optimize -->
      <img [src]="previewUrl()" alt="Cover preview" i18n-alt="@@upload.cover.previewAlt" class="cover-img" />
      <button type="button" class="btn btn-danger-outline btn-sm remove-cover-btn" (click)="removed.emit()" i18n="@@upload.cover.change">
        Change Cover
      </button>
    </div>
  } @else {
    <!-- Outside the drop zone: a control must not sit inside another (role="button"); the zone opens it. -->
    <input
      #coverInput
      type="file"
      accept="image/jpeg,image/png,image/webp"
      class="sr-only"
      tabindex="-1"
      aria-hidden="true"
      (change)="onInputChange($event)"
    />
    <div
      class="cover-drop-zone"
      (dragover)="$event.preventDefault()"
      (drop)="onDrop($event)"
      (click)="coverInput.click()"
      (keydown.enter)="coverInput.click()"
      (keydown.space)="$event.preventDefault(); coverInput.click()"
      tabindex="0"
      role="button"
      aria-label="Upload cover image"
      i18n-aria-label="@@upload.cover.dropZone"
    >
      <span class="cover-icon" aria-hidden="true">🖼️</span>
      <p><strong i18n="@@upload.cover.upload">Upload Cover</strong></p>
      <p class="muted small" i18n="@@upload.cover.hint">Drag & drop or browse (JPEG, PNG, WebP)</p>
    </div>
  }
</div>
