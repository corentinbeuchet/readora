<div class="card wizard-card">
  <h2>1. Manga / Series Information</h2>
  <p class="muted">Provide basic metadata and a cover image for readers to discover your work.</p>

  <div class="form-layout">
    <div class="form-fields">
      <div class="field">
        <label for="manga-title">Series Title <span class="required" aria-hidden="true">*</span></label>
        <input id="manga-title" type="text" placeholder="e.g. Solo Leveling, Berserk"
               [formField]="form.title" [appAriaInvalid]="form.title" aria-describedby="manga-title-error" />
        <app-field-errors id="manga-title-error" [field]="form.title" />
      </div>

      <div class="form-row">
        <div class="field">
          <label for="manga-type">Work Type</label>
          <select id="manga-type" [formField]="form.type">
            <option value="MANGA">Manga (Japanese)</option>
            <option value="MANHWA">Manhwa (Korean)</option>
            <option value="MANHUA">Manhua (Chinese)</option>
            <option value="COMIC">Comic (Western / Global)</option>
          </select>
        </div>

        <div class="field">
          <label for="manga-status">Publication Status</label>
          <select id="manga-status" [formField]="form.status">
            <option value="ONGOING">Ongoing</option>
            <option value="COMPLETED">Completed</option>
            <option value="HIATUS">Hiatus</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="manga-author">Author</label>
          <input id="manga-author" type="text" placeholder="e.g. Chugong"
                 [formField]="form.author" [appAriaInvalid]="form.author" aria-describedby="manga-author-error" />
          <app-field-errors id="manga-author-error" [field]="form.author" />
        </div>

        <div class="field">
          <label for="manga-demographic">Audience</label>
          <select id="manga-demographic" [formField]="form.demographic">
            <option value="">Not specified</option>
            <option value="SHOUNEN">Shounen</option>
            <option value="SHOUJO">Shoujo</option>
            <option value="SEINEN">Seinen</option>
            <option value="JOSEI">Josei</option>
          </select>
        </div>
      </div>

      <fieldset class="field">
        <legend>Genres</legend>
        <div class="genre-pill-container">
          @for (genre of genres(); track genre.name) {
            <button type="button" class="genre-pill" [class.selected]="genre.selected" [attr.aria-pressed]="genre.selected"
                    (click)="wizard.toggleGenre(genre.name)">
              {{ genre.name }}
            </button>
          }
        </div>
        <div class="custom-genre-row">
          <input #custom type="text" class="input-sm" placeholder="Add custom genre" aria-label="Custom genre"
                 (keydown.enter)="addGenre(custom); $event.preventDefault()" />
          <button type="button" class="btn btn-sm" (click)="addGenre(custom)">Add</button>
        </div>
      </fieldset>

      <div class="field">
        <label for="manga-synopsis">Synopsis</label>
        <textarea id="manga-synopsis" rows="4" placeholder="Brief summary of the story, characters, and setting…"
                  [formField]="form.synopsis"></textarea>
      </div>
    </div>

    <app-cover-picker [previewUrl]="wizard.cover()?.previewUrl ?? ''" (fileSelected)="wizard.setCover($event)" (removed)="wizard.removeCover()" />
  </div>

  <div class="wizard-actions wizard-actions-end">
    <button type="button" class="btn btn-primary" [disabled]="!wizard.seriesValid()" (click)="wizard.goTo('chapter')">
      Next: Chapter Setup &rarr;
    </button>
  </div>
</div>
