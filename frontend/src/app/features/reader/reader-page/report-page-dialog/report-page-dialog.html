<app-dialog labelledBy="report-title" (closed)="closed.emit()">
  <form class="form" (submit)="send($event)" novalidate>
    <h2 id="report-title" i18n="@@reader.report.title">Report page {{ pageNumber() }}</h2>
    <fieldset class="report-reasons">
      <legend i18n="@@reader.report.question">What is wrong with it?</legend>
      @for (option of reasons; track option) {
        <label class="checkbox">
          <input type="radio" name="report-reason" [value]="option" [checked]="reason() === option" (change)="choose(option)" />
          {{ labels[option] }}
        </label>
      }
    </fieldset>
    @if (sending.error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
    <div class="dialog-actions">
      <button type="button" class="btn" (click)="closed.emit()" i18n="@@reader.report.cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" [disabled]="sending.busy()">
        @if (sending.busy()) {
          <ng-container i18n="@@reader.report.sending">Sending…</ng-container>
        } @else {
          <ng-container i18n="@@reader.report.send">Send report</ng-container>
        }
      </button>
    </div>
  </form>
</app-dialog>
