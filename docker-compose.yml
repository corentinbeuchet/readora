services:
  postgres:
    image: postgres:16-alpine
    container_name: readora-postgres
    environment:
      POSTGRES_DB: readoradb
      POSTGRES_USER: readora_user
      POSTGRES_PASSWORD: readora_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readora_user -d readoradb"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: readora-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: readora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing local/readora-media-dev;
      /usr/bin/mc anonymous set download local/readora-media-dev;
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Rebuild the image on every `docker compose up`: unchanged code is all cache hits (seconds),
    # changed code re-runs only `mvn package`. No need for `--build` any more.
    pull_policy: build
    # `docker compose up --watch` (or `docker compose watch`): rebuild + restart on every save.
    develop:
      watch:
        - { action: rebuild, path: ./backend/pom.xml }
        - { action: rebuild, path: ./backend/readora-domain/pom.xml }
        - { action: rebuild, path: ./backend/readora-domain/src/main }
        - { action: rebuild, path: ./backend/readora-application/pom.xml }
        - { action: rebuild, path: ./backend/readora-application/src/main }
        - { action: rebuild, path: ./backend/readora-infrastructure/pom.xml }
        - { action: rebuild, path: ./backend/readora-infrastructure/src/main }
        - { action: rebuild, path: ./backend/readora-web/pom.xml }
        - { action: rebuild, path: ./backend/readora-web/src/main }
    container_name: readora-backend
    environment:
      # `local` adds the dev seed accounts (password readora-dev, see AGENTS.md).
      SPRING_PROFILES_ACTIVE: staging,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/readoradb
      SPRING_DATASOURCE_USERNAME: readora_user
      SPRING_DATASOURCE_PASSWORD: readora_pass

      AWS_S3_ENABLED: "true"
      AWS_S3_BUCKET_NAME: readora-media-dev
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadminpassword
      AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-http://localhost:9000/readora-media-dev}

      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      READORA_CORS_ALLOWED_ORIGINS: ${READORA_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      READORA_COOKIE_SECURE: "false"
      # Login/register/refresh per IP per minute (production default 10, kept here so rate-limit bugs show up
      # locally). `npm run e2e:stress` repeats every sign-up: start the stack with READORA_AUTH_RATE_LIMIT=200.
      READORA_SECURITY_RATELIMIT_MAXATTEMPTS: ${READORA_AUTH_RATE_LIMIT:-10}

      READORA_JWT_SECRET: ${READORA_JWT_SECRET:-local-compose-readora-jwt-secret-change-me-0123456789}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
