name: Deploy to Staging & Run Playwright E2E

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy-staging:
    name: Build & Deploy Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend Container JAR
        working-directory: backend
        run: mvn -B -pl readora-web -am clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy Backend to AWS App Runner (Staging)
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APPRUNNER_STAGING_ARN }}

      - name: Set up Node.js & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Staging Distribution
        working-directory: frontend
        run: |
          npm ci
          npm run build:staging

      - name: Sync Frontend to S3 Staging & Invalidate CloudFront
        run: |
          aws s3 sync frontend/dist/readora-frontend/browser s3://readora-frontend-staging --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_STAGING_DIST_ID }} --paths "/*"

  e2e-staging-verification:
    name: Run Playwright E2E against Staging
    needs: build-and-deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Playwright Browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright Cross-Browser UI Tests on Staging
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: https://staging.readora.com
        run: npm run e2e:staging

      - name: Upload Playwright Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: frontend/playwright-report/
          retention-days: 14
