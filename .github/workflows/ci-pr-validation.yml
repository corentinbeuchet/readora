name: PR Validation CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-fast-validation:
    name: Backend Unit, ArchUnit & BDD Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Domain, ArchUnit & Web Integration Tests
        working-directory: backend
        run: mvn -B test -pl readora-domain,readora-application,readora-infrastructure,readora-web

      - name: Run BDD Acceptance Tests (readora-acceptance)
        working-directory: backend
        run: mvn -B -pl readora-acceptance -am -Dsurefire.failIfNoSpecifiedTests=false -Dtest=CucumberAcceptanceTest test

  frontend-fast-validation:
    name: Frontend Vitest Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests (jsdom, tests/unit)
        working-directory: frontend
        run: npm run test:ci

      - name: Build Frontend (Typecheck & Compilation)
        working-directory: frontend
        run: npm run build:staging
