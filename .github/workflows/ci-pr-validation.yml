name: PR Validation CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  backend-fast-validation:
    name: Backend Unit, ArchUnit & BDD Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # verify = unit, ArchUnit, web integration (Flyway on H2), PostgreSQL migration test (Testcontainers) and
      # the Cucumber acceptance suite, in one reactor build.
      - name: Build and run all backend tests
        working-directory: backend
        run: mvn -B verify

  frontend-fast-validation:
    name: Frontend Lint, Vitest Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint + angular-eslint template rules)
        working-directory: frontend
        run: npm run lint

      # Missing texts already fail the build; this also catches stale, misplaced and generated ids.
      - name: Check translations (ids, placeholders, per-feature files)
        working-directory: frontend
        run: npm run i18n:check

      - name: Run Vitest Unit Tests (jsdom, tests/unit)
        working-directory: frontend
        run: npm run test:ci

      - name: Build Frontend (Typecheck & Compilation)
        working-directory: frontend
        run: npm run build:staging
