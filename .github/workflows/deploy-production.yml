name: Promote to Production (Gated)

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package Backend JAR
        working-directory: backend
        run: mvn -B -pl readora-web -am clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy Backend to AWS App Runner (Production)
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APPRUNNER_PROD_ARN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Distribution
        working-directory: frontend
        run: |
          npm ci
          npm run build:prod

      - name: Sync Frontend to S3 Production & Invalidate CloudFront
        run: |
          aws s3 sync frontend/dist/readora-frontend/browser s3://readora-frontend-prod --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_PROD_DIST_ID }} --paths "/*"

      - name: Production Health Check
        run: |
          curl --fail --retry 5 --retry-delay 10 https://api.readora.com/api-docs || exit 1
